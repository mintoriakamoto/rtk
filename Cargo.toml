[package]
name = "rtk"
version = "0.42.4"
edition = "2021"
rust-version = "1.91"
authors = ["Patrick Szymkowiak"]
description = "Rust Token Killer - High-performance CLI proxy to minimize LLM token consumption"
license = "Apache 2.0"
homepage = "https://www.rtk-ai.app"
repository = "https://github.com/mintoriakamoto/rtk"
readme = "README.md"
keywords = ["cli", "llm", "token", "filter", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "color",
] }
anyhow = "1.0"
ignore = "0.4"
walkdir = "2"
# unicode-perl keeps \b \w \d \s working, unicode-case keeps (?i) working.
# The heavy \p{...} tables (gencat/script/age/segment) are unused: no pattern
# in src/ or src/filters/*.toml uses \p{...}. User-authored \p{...} in custom
# filters.toml fails loudly at Regex::new with a clear error, not silently.
regex = { version = "1", default-features = false, features = [
    "std",
    "perf",
    "unicode-perl",
    "unicode-case",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
colored = "3"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
tempfile = "3"
sha2 = "0.10"
# Shared HTTP client for `rtk sync` (portal metering) and the optional
# telemetry ping. Enabled by default because sync is a product feature;
# `--no-default-features` still builds a fully working local-only CLI.
ureq = { version = "2", default-features = false, features = [
    "tls",
], optional = true }
getrandom = "0.4"
flate2 = "1.0"
quick-xml = "0.37"
which = "8"
automod = "1"

[features]
default = ["sync"]
# `rtk sync` — uploads per-day savings aggregates to a portal for metering.
sync = ["dep:ureq"]
# Compiles in the HTTP client used for the opt-in usage ping and GDPR erasure
# requests. Only useful together with RTK_TELEMETRY_URL at build time; a build
# without it has no telemetry endpoint and never phones home.
telemetry = ["dep:ureq"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# cargo-deb configuration
[package.metadata.deb]
# Official packages ship with the telemetry HTTP client compiled in (still
# opt-in at runtime and inert without RTK_TELEMETRY_URL at build time).
features = ["telemetry"]
maintainer = "Patrick Szymkowiak"
copyright = "2024 Patrick Szymkowiak"
license-file = ["LICENSE", "0"]
extended-description = "rtk filters and compresses command outputs before they reach your LLM context, saving 60-90% of tokens."
section = "utility"
priority = "optional"
assets = [
    ["target/release/rtk", "usr/bin/", "755"],
]
# cargo-generate-rpm configuration
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rtk", dest = "/usr/bin/rtk", mode = "755" },
]

[lints.rust]
unsafe_code = "deny"
warnings = "deny"
