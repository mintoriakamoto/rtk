version: 2
updates:
  - package-ecosystem: "cargo"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # Routine minor/patch bumps arrive as a single grouped PR; security
    # updates still open immediately as their own PRs.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "area:ci"
